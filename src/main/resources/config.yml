# ----------------------------------------------------------------#
#                    Configuration de SHSlots                     #
# ----------------------------------------------------------------#
#
# Emplacements d'affichage temporaires (slots) attribués à des joueurs : chaque slot montre un pseudo et un message
# (placeholders PlaceholderAPI) et est annoncé dans le chat avec un lien vers l'île du sponsor.
# Avec SHNetwork, les slots sont communs à tous les serveurs de jeu (voir la section reseau en bas du fichier).
#
# Commandes (racine /shslots) :
#   /shslots set <slot> <joueur> <temps>      Attribue un slot à un joueur pour une durée (exemple : 1h30m). Appelée en
#                                             console par le menu /slots.
#   /shslots remove <joueur>                  Retire le slot d'un joueur.
#   /shslots blacklist add|remove <joueur>    Ajoute un joueur à la blacklist des slots, ou l'en retire.
#   /shslots blacklist list                   Liste les joueurs blacklistés avec la date de leur sanction.
#   /shslots menu                             Ouvre le menu d'administration (ancien nom : admin).
#   /shslots list                             Liste les slots occupés avec leur joueur, leur temps restant et leur message.
#   /shslots import                           Avec SHNetwork : reprend slots_data.json, users.yml et la blacklist de ce
#                                             fichier dans la base partagée, sans toucher à ce qui y est déjà.
#   /shslots reload                           Recharge config.yml et messages.yml ; si un fichier est illisible, l'ancienne
#                                             configuration reste active. Ne touche ni aux slots, ni à users.yml, ni à la
#                                             blacklist. La section reseau demande un redémarrage.
#
# Permissions (op par défaut ; chaque sous-commande a la sienne, shslots.admin les donne toutes) :
#   shslots.admin             Toutes les sous-commandes de /shslots.
#   shslots.admin.set         set.
#   shslots.admin.remove      remove.
#   shslots.admin.blacklist   blacklist add, remove et list.
#   shslots.admin.menu        menu.
#   shslots.admin.list        list.
#   shslots.admin.import      import.
#   shslots.admin.reload      reload.
#
# Les textes (commande, menus d'administration, annonce) sont dans messages.yml. Les messages saisis par les joueurs
# pour leur slot sont écrits dans le fichier messages de SHLogs.
#
# Les têtes des menus d'administration prennent le skin des joueurs dans SHSkins quand il est installé. Sans lui, elles
# n'ont que l'UUID et le pseudo (skin par défaut) ; le plugin ne fait aucune requête à Mojang.

# Nombre de slots disponibles (numérotés de 1 à max_slots).
max_slots: 3

# Annonce des slots dans le chat.
announcement:
  # Minutes entre deux annonces.
  interval: 15
  # Commande lancée par le clic sur l'annonce.
  click_command: /is warps %sponsor%
  # Son joué avec l'annonce.
  sound: BLOCK_NOTE_BLOCK_XYLOPHONE

# Plusieurs serveurs de jeu : actif seulement si SHNetwork est installé ; sans lui, ou avec actif: false, rien ne change
# (slots dans slots_data.json, derniers messages dans users.yml, blacklist dans la section blacklist de ce fichier).
# Avec SHNetwork, slots, derniers messages et blacklist sont dans la base ci-dessous, partagée par tous les serveurs, et :
#   - /shslots set, remove et blacklist visent un joueur connecté sur n'importe quel serveur ;
#   - le joueur saisit le message de son slot dans le chat du serveur où il se trouve ;
#   - un seul serveur, le meneur, lance l'annonce des slots, affichée sur tous les serveurs ;
#   - slots_data.json, users.yml et la section blacklist ne sont plus ni lus ni écrits : /shslots import les reprend.
# Tous les serveurs doivent avoir le même config.yml et le même messages.yml (nombre de slots, annonce, textes). Demande un redémarrage : tout le bloc.
reseau:
  actif: true
  # Canal du bus SHNetwork : changements de la base, invitation à saisir un message et annonces
  canal: shslots
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shslots
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion à la base, en millisecondes. Une base qui ne répond pas fait échouer la commande
    # avec un message, jamais le serveur.
    delai-ms: 5000

# Joueurs interdits d'utiliser les slots. Modifié par /shslots blacklist et par le menu d'administration.
# Avec SHNetwork, la blacklist est dans la base et cette liste n'est plus utilisée.
blacklist: []
